name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Upload renderer bundle
        uses: actions/upload-artifact@v4
        with:
          name: novacode-dist-${{ matrix.os }}
          path: dist
          retention-days: 7

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            core: nsis
            extra: msi
          - os: macos-latest
            platform: mac
            core: dmg
            extra: ''
          - os: ubuntu-latest
            platform: linux
            core: AppImage deb
            extra: rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Linux packaging tools (rpm)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build renderer
        run: npm run build
      - name: Package installers (core targets)
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.core }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package installers (optional targets)
        if: matrix.extra != ''
        continue-on-error: true
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.extra }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novacode-installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: ignore
          retention-days: 1

  release:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: novacode-installers-*
          path: assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release (all platform installers)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NovaCode ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
